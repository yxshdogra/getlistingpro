# Build + push the ListingPro web image.
#
#   gcloud builds submit --project jaatpride-05874 --config cloudbuild.yaml \
#     --substitutions _NEXT_PUBLIC_RAZORPAY_KEY_ID=...,_NEXT_PUBLIC_META_PIXEL_ID=...,\
#   _NEXT_PUBLIC_WHATSAPP_ONBOARDING_URL=...,_NEXT_PUBLIC_SITE_BASE_URL=...
#
# NEXT_PUBLIC_* values are baked into the bundles at build time (they are not
# secrets — they ship to every browser). Server secrets are runtime env on the
# Cloud Run service and never appear here or in the image.
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/jaatpride-05874/cloud-run-source-deploy/listingpro-web
  _NEXT_PUBLIC_RAZORPAY_KEY_ID: ""
  _NEXT_PUBLIC_META_PIXEL_ID: ""
  _NEXT_PUBLIC_WHATSAPP_ONBOARDING_URL: ""
  _NEXT_PUBLIC_SITE_BASE_URL: "https://www.getlistingpro.com"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - --build-arg=NEXT_PUBLIC_META_PIXEL_ID=${_NEXT_PUBLIC_META_PIXEL_ID}
      - --build-arg=NEXT_PUBLIC_WHATSAPP_ONBOARDING_URL=${_NEXT_PUBLIC_WHATSAPP_ONBOARDING_URL}
      - --build-arg=NEXT_PUBLIC_SITE_BASE_URL=${_NEXT_PUBLIC_SITE_BASE_URL}
      - -t
      - ${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
